name: Sync Figma Icons

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figma-icon-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export canonical Figma frame
        run: npm run export:figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: xl01U3PawlPC5RtraiZVaV
          FIGMA_ICON_NODE_ID: "22:4"
      - run: npm run verify:sources
      - run: npm run build
      - run: npm run verify:package
      - name: Prepare review artifact
        run: tar -czf /tmp/figma-icon-sync.tgz svg icons.manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: figma-icon-sync
          path: /tmp/figma-icon-sync.tgz
          retention-days: 7
