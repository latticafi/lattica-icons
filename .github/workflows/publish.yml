name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sync_figma:
        description: "Sync icons from Figma before build"
        required: false
        default: "false"
        type: boolean
      publish:
        description: "Publish the current package version"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
      - run: npm ci
      - name: Sync from Figma
        if: ${{ github.event.inputs.sync_figma == 'true' }}
        run: npm run export:figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
      - run: npm run build
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-release-tag.mjs
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
